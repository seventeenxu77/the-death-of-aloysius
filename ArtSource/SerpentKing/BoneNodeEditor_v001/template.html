<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>四头蛇 · 骨链联动编辑</title>
<style>*{box-sizing:border-box}body{margin:0;background:#130f17;color:#e5d3b0;font:14px/1.6 system-ui,'Microsoft YaHei'}main{max-width:1750px;margin:auto;padding:16px}h1{font-size:20px;margin:0 0 8px;font-weight:500}p{color:#baa99a}section{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}canvas{width:100%;display:block;touch-action:none;border:1px solid #6a4b31;background:#21141e}aside{background:#231a23;padding:16px}button,select,input{font:inherit;accent-color:#dcac62}button,select{background:#3c2b2e;border:1px solid #78573b;color:#f5ddb2;padding:7px 10px;margin:3px 2px;cursor:pointer}button.active{background:#73512e;border-color:#e3b16a}input[type=number]{width:74px;background:#17121b;border:1px solid #7a5a3b;color:#f3d6a8;padding:5px}input[type=range]{width:100%}label{display:block;margin:12px 0}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:8px 0}.group{border-top:1px solid #4c3940;padding-top:12px;margin-top:16px}.muted{color:#b6a498}#message{min-height:24px;color:#dfb96d}#nodeButtons button{font-size:12px}a{color:#e8bc72}@media(max-width:1000px){section{grid-template-columns:1fr}}</style>
<main><h1>四头蛇 · 分节骨链联动</h1><p>每头10节父子骨骼、6个主要控制点。拖一个点，骨链配合弯曲，后续颈部和头部自动跟随；每节长度保持不变。</p><section><div><canvas id="stage" width="1536" height="1024"></canvas><div class="bar"><button id="play">播放循环</button><span id="playStatus">编辑中</span><input id="scrub" type="range" min="0" max="1" step=".001" value="0"></div><div id="message"></div></div>
<aside><b>1 · 选择蛇头</b><div id="heads" class="bar"></div><label><input type="checkbox" id="isolate"> 只显示选中的头与盘身</label>
<div class="group"><b>2 · 选择姿势</b><div id="poses" class="bar"></div><small class="muted">“到边缘”和“下沉”分开调整。下沉姿势播放时带停顿。</small><div><button id="copy">复制当前头到下一姿势</button></div></div>
<div class="group"><b>3 · 拖节点</b><div id="nodeButtons" class="bar"></div><label><input id="lockRoot" type="checkbox" checked> 固定颈根</label><label><input id="keepFacing" type="checkbox" checked> 拖头时保持脸部朝向</label><label><input id="showBones" type="checkbox" checked> 显示节点和骨链</label><label>目标水平偏移 <input id="nodeX" type="number" step="1" value="0"></label><label>目标垂直偏移 <input id="nodeY" type="number" step="1" value="0"></label><label>所选骨节旋转（带动后续骨节） <input id="angleNumber" type="number" min="-180" max="180" step="1" value="0"> °<input id="angle" type="range" min="-180" max="180" step=".5" value="0"></label><button id="resetNode">重置此节旋转</button><button id="resetHead">重置当前头姿势</button><button id="undo">撤销</button></div>
<div class="group"><label>循环频率 <input id="frequency" type="number" min=".05" max="2" step=".01" value=".36"> Hz <span id="period"></span></label><button id="save">保存配置 JSON</button><button id="load">载入配置</button><input id="file" type="file" accept=".json" hidden><button id="png">保存当前图片</button><p>拖动节点由骨链求解位置；旋转数值直接转动这一节。旧版 JSON 可导入并转换，受固定骨长约束，转换后位置可能略有变化。调整会自动暂存到当前浏览器。要交回项目，请保存 JSON 文件。HTML 可离线使用，不需要 Unity。</p></div></aside></section></main>
<script>window.RIG=__RIG__;window.ASSETS=__ASSETS__;</script><script>__JS__</script></html>
