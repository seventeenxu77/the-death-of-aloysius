<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巨石蛇头 · 黑金剪影下砸</title><style>
*{box-sizing:border-box}body{margin:0;background:#100911;color:#d6bc98;font:15px/1.8 'Microsoft YaHei',sans-serif;display:flex;justify-content:center;align-items:center;gap:28px;min-height:100vh;padding:16px}canvas{height:91vh;width:auto;max-width:74vw;object-fit:contain}aside{width:260px}h1{font-size:24px;font-weight:500}p,small{color:#b39ba9}label{display:block;margin-top:20px}input[type=range]{width:100%;accent-color:#ba8d55}output{float:right}button{background:#332030;border:1px solid #79576c;color:#e5cfb0;padding:8px 18px;margin-right:8px;cursor:pointer}input[type=checkbox]{accent-color:#ba8d55}#phase{color:#d3a972;font-size:18px}@media(max-width:720px){body{flex-direction:column}canvas{height:auto;max-width:95vw;width:95vw}aside{width:90vw}}
</style></head><body><canvas id="stage" width="1024" height="1024"></canvas><aside><small>BREAKER · GROUND SLAM</small><h1>黑金剪影 · 蓄力重砸</h1><label>时间位置<input id="seek" type="range" min="0" max="5.99" step=".01" value="0"></label><p id="phase">待机</p><p>向上收紧，短促抖动，突然加速砸向地面。碰撞瞬间停顿，再小幅回弹。</p><button id="play">暂停</button><button id="reset">重新播放</button><label><input id="bones" type="checkbox"> 显示骨骼</label><label><input id="still" type="checkbox"> 绑定姿势</label><label>播放速度<output id="speedValue">1.00×</output></label><input id="speed" type="range" min=".2" max="1.5" step=".05" value="1"><p><small>6 秒循环；0.22 秒下砸，0.10 秒撞击停顿。头部刚性蒙皮，鼻尖按地面落点定位。已移除攻击特效；本版为独立预览，未替换游戏。</small></p></aside><script>window.RIG=__RIG__;window.ATLAS='__ATLAS__';window.CLOSED='__CLOSED__';window.OFFLINE_RENDER=location.search.includes('render=1');</script><script>__SCRIPT__</script></body></html>
