<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>四头蛇 · 贝塞尔姿态编辑</title>
<style>*{box-sizing:border-box}body{margin:0;background:#130f17;color:#e8d5b1;font:14px/1.65 system-ui,'Microsoft YaHei'}main{max-width:1750px;margin:auto;padding:16px}h1{font-size:21px;margin:0;font-weight:500}p,small{color:#baa99e}section{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}canvas{display:block;width:100%;touch-action:none;border:1px solid #76533b}aside{background:#241a24;padding:16px}button,select,input{font:inherit;accent-color:#e0aa58}button,select{cursor:pointer;border:1px solid #79563b;background:#3b292c;color:#f2d7a8;padding:7px 9px;margin:3px 2px}button.active{background:#77522d;border-color:#e3b264}label{display:block;margin:12px 0}input[type=range]{width:100%}input[type=number]{width:72px;background:#171219;border:1px solid #76533b;color:#f0d7ac;padding:5px}.group{margin-top:14px;padding-top:12px;border-top:1px solid #513b42}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:9px 0}#message{min-height:24px;color:#dfb767}#nodes button{font-size:12px}@media(max-width:1000px){section{grid-template-columns:1fr}}</style>
<main><h1>四头蛇 · 各头独立细节动态</h1><p>圆点是身体关键位置，空心点是贝塞尔弧度手柄。颈根固定，沿整条中心曲线变形，头部保持刚性。</p><section><div><canvas id="stage" width="1536" height="1216"></canvas><div class="bar"><button id="play">播放循环</button><span id="status">编辑中</span><input id="scrub" type="range" min="0" max="1" step=".001" value="0"></div><div id="message"></div></div>
<aside><b>选择蛇头</b><div id="heads" class="bar"></div><label><input id="isolate" type="checkbox"> 单独显示当前蛇颈与盘身</label><label><input id="bed" type="checkbox" checked> 显示床</label><div class="group"><b>三个姿态</b><div id="poses" class="bar"></div><button id="copy">复制当前头到下一姿态</button><p>四个头同步：左低 → 中高 → 右低 → 中高。仅后方毒液头抬高，其余三个头恢复原版。</p></div>
<div class="group"><b>调整曲线</b><div id="nodes" class="bar"></div><label><input id="lockRoot" type="checkbox" checked> 固定颈根</label><label><input id="linked" type="checkbox" checked> 拖弯曲中心时带动上段和头</label><label><input id="showCurve" type="checkbox" checked> 显示曲线、分节与控制点</label><label>控制点 X <input id="x" type="number" step="1"></label><label>控制点 Y <input id="y" type="number" step="1"></label><label>头部附加角度 <input id="angle" type="number" min="-45" max="45" step="1" value="0"> °</label><button id="reset">恢复当前头的预设</button><button id="undo">撤销</button><small id="length"></small></div>
<div class="group"><b>各头独立动态</b><label><input id="detailsEnabled" type="checkbox" checked> 眨眼、吐信、点头与毒囊</label><label>细节强度<input id="detailsStrength" type="range" min="0" max="1.5" step=".05" value="1"></label><label>细节演出时间<input id="detailSeek" type="range" min="0" max="8.3333" step=".01" value="0"></label><small>巨石：慢眨眼与沉重点头；突刺：快速吐信与短促颤动；毒液：毒囊交错鼓动；时间：缓慢眨眼和轻微颔首。</small></div><div class="group"><label>循环频率 <input id="frequency" type="number" min=".05" max="2" step=".01" value="1.35"> Hz <span id="period"></span></label><button id="save">保存配置 JSON</button><button id="load">载入配置</button><input id="file" type="file" accept=".json" hidden><button id="png">保存当前姿态图片</button><p>拖动后自动暂存到当前浏览器。保存 JSON 可把调整交回项目。原来的节点编辑器和旧配置保持原样。</p></div></aside></section></main><script>window.RIG=__RIG__;window.ASSETS=__ASSETS__;</script><script>__JS__</script></html>
