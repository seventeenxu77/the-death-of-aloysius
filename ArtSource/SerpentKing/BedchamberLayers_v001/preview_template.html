<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>巨蛇寝宫 · 分层与床帘</title>
<style>body{margin:0;background:#171015;color:#e7d8be;font:16px system-ui}header{padding:20px 26px}h1{font-size:23px;margin:0 0 10px}p{color:#bdae9c;font-size:14px}button,select{background:#39252c;color:#f3e4c6;border:1px solid #806848;border-radius:5px;padding:8px 16px;margin:4px;cursor:pointer}input{width:260px;vertical-align:middle;accent-color:#b89352}canvas{display:block;width:min(100%,1400px);height:auto;margin:0 auto;background:#21141b}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;padding:25px}figure{margin:0;background:repeating-conic-gradient(#3c3439 0% 25%,#30292e 0% 50%) 50%/24px 24px;border:1px solid #695348}figure img{display:block;width:100%;height:250px;object-fit:contain}figcaption{padding:10px;background:#21181e}a{color:#dfbc7b}footer{padding:20px;color:#bdae9c;font-size:13px}</style>
<header><h1>巨蛇寝宫 · 独立素材与床帘开合</h1><div><button id="play">播放开合</button><button id="close">闭合</button><button id="open">拉开</button><label>开合程度 <input id="amount" type="range" min="0" max="1" step="0.001" value="0"></label><select id="view"><option value="bed">床帘特写</option><option value="scene">场景组装</option></select></div><p>左右帘独立收拢，床架与床铺固定。下方是全部 13 张素材；棋盘格代表透明区域。</p></header>
<canvas id="stage" width="1536" height="1024"></canvas><div id="gallery"></div><footer>这是基于概念图补绘的分层资产及开合示意；未接入 Unity。墙体、地板、窗框仍合在建筑底图内。床内预留巨蛇角色层，目前展示完整空床铺。</footer>
<script>
const manifest=__MANIFEST__, urls=__IMAGES__, images={};
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),amount=document.getElementById('amount'),view=document.getElementById('view');let playing=false,start=0;
function sprite(name,rect){const s=manifest.assets[name].sourceRect;ctx.drawImage(images[name],...s,...rect)}
function curtain(name,left,p){const s=manifest.assets[name].sourceRect;const count=96;for(let i=0;i<count;i++){const v=i/count;const w=585+(140-585)*p+Math.sin(v*Math.PI)*22*p;const h=740-18*p;const x=left?190:1345-w;ctx.drawImage(images[name],s[0],s[1]+s[3]*v,s[2],s[3]/count,x,225+h*v,w,h/count+0.4)}}
function bed(p){sprite('Bed_Interior',[225,350,1090,600]);curtain('Curtain_Left',true,p);curtain('Curtain_Right',false,p);ctx.drawImage(images.Bed_Frame,0,0,1536,1024)}
function draw(p){ctx.clearRect(0,0,canvas.width,canvas.height);if(view.value==='scene'){ctx.drawImage(images.Scene_Empty,0,0,1774,887);for(const a of manifest.instances)sprite(a.asset,a.rect);ctx.save();ctx.translate(340,108);ctx.scale(620/1536,390/1024);bed(p);ctx.restore()}else{ctx.fillStyle='#291a23';ctx.fillRect(0,0,1536,1024);bed(p)}}
function resize(){canvas.width=view.value==='scene'?1774:1536;canvas.height=view.value==='scene'?887:1024;draw(+amount.value)}
function tick(now){if(playing){let t=((now-start)/1000)%8;let p=t<1?0:t<3.5?(t-1)/2.5:t<4.5?1:t<7?1-(t-4.5)/2.5:0;p=p*p*(3-2*p);amount.value=p;draw(p)}requestAnimationFrame(tick)}
document.getElementById('play').onclick=()=>{playing=!playing;start=performance.now();document.getElementById('play').textContent=playing?'暂停':'播放开合'};
for(const [id,p] of [['close',0],['open',1]])document.getElementById(id).onclick=()=>{playing=false;amount.value=p;draw(p);document.getElementById('play').textContent='播放开合'};
amount.oninput=()=>{playing=false;draw(+amount.value)};view.onchange=resize;
Promise.all(Object.entries(urls).map(([name,url])=>new Promise(resolve=>{let im=new Image;im.onload=()=>{images[name]=im;resolve()};im.src=url}))).then(()=>{for(const [name,a] of Object.entries(manifest.assets)){let f=document.createElement('figure');let im=document.createElement('img');im.src=urls[name];let c=document.createElement('figcaption');let link=document.createElement('a');link.href=urls[name];link.download=name+'.png';link.textContent=a.label+' · PNG';c.append(link);f.append(im,c);document.getElementById('gallery').append(f)}resize();window.ready=true;requestAnimationFrame(tick)});
window.drawAt=(seconds)=>{const t=seconds%8;let p=t<1?0:t<3.5?(t-1)/2.5:t<4.5?1:t<7?1-(t-4.5)/2.5:0;draw(p*p*(3-2*p))};
</script></html>
