<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>守卫回头 · 动画预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#12100e;color:#d7c2a5;font:15px system-ui,"Microsoft YaHei",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}main{width:min(980px,96vw);padding:16px 0}h1{font-size:20px;font-weight:500;margin:0 0 10px}canvas{display:block;width:auto;max-width:100%;height:min(74vh,720px);margin:auto;background:#000}nav{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:15px}button{background:#37271b;color:#f3d1a4;border:1px solid #705037;border-radius:5px;padding:9px 18px;cursor:pointer}label{display:flex;align-items:center;gap:8px}input{accent-color:#d88e45;width:110px}p{text-align:center;font-size:13px;color:#ac9276;margin:0}output{min-width:30px}#error{color:#ffa474}
</style>
<main><h1>守卫回头 · 头部轻摆</h1><canvas id="view" width="1448" height="1086" aria-label="身体固定，头部绕颈部小幅左右摆动的动画"></canvas>
<nav><button id="pause">暂停</button><button id="replay">重新播放</button><label>摆幅 <input id="amplitude" type="range" min="0" max="6" step=".1" value="2.8"><output id="ampValue">2.8°</output></label><label>速度 <input id="speed" type="range" min=".4" max="1.8" step=".1" value="1"><output id="speedValue">1×</output></label></nav>
<p id="status">正在加载动画…</p><p id="error"></p></main>
<script>
const src={head:'__HEAD__',background:'__BACKGROUND__',original:'__ORIGINAL__'};
const canvas=document.querySelector('#view'),ctx=canvas.getContext('2d'),W=1448,H=1086;
const amplitude=document.querySelector('#amplitude'),speed=document.querySelector('#speed');
let paused=false,elapsed=0,last=0,images;
const keys=[[0,0],[.48,-1],[.92,-1],[1.65,.78],[2.05,.78],[2.75,-.24],[3.3,0],[5.2,0]];
const body=new Path2D('M0 950 C65 882 85 866 182 892 L225 772 C395 782 646 865 816 960 Q826 973 814 990 L798 1086 L0 1086 Z');
function poseAt(seconds){const t=((seconds%5.2)+5.2)%5.2;let a=keys[0],b=keys[1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){a=keys[i-1];b=keys[i];break}}let u=(t-a[0])/(b[0]-a[0]);u=u*u*u*(u*(u*6-15)+10);return a[1]+(b[1]-a[1])*u}
function render(seconds){
 const sway=poseAt(seconds),angle=sway*Number(amplitude.value)*Math.PI/180;
 ctx.clearRect(0,0,W,H);ctx.drawImage(images.background,0,0,W,H);
 // Head pivots inside the standing collar. Background and shoulder do not move.
 ctx.save();ctx.beginPath();ctx.rect(10,10,W-20,H-20);ctx.clip();
 ctx.translate(610+sway*2,884);ctx.rotate(angle);ctx.scale(1-Math.abs(sway)*.006,1);ctx.translate(-610,-884);
 ctx.drawImage(images.head,0,0,W,H);ctx.restore();
 // Original collar covers the neck overlap, avoiding a gap at either extreme.
 ctx.save();ctx.clip(body);ctx.drawImage(images.original,0,0,W,H);ctx.restore();
 ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.rect(12,12,W-24,H-24);ctx.clip('evenodd');ctx.drawImage(images.background,0,0,W,H);ctx.restore();
 window.guardPose={time:seconds,angle:angle*180/Math.PI,pivot:[610,884]};
}
function loop(now){if(last&&!paused)elapsed+=(now-last)/1000*Number(speed.value);last=now;render(elapsed);requestAnimationFrame(loop)}
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'播放':'暂停'};
document.querySelector('#replay').onclick=()=>{elapsed=0;paused=false;document.querySelector('#pause').textContent='暂停'};
amplitude.oninput=()=>document.querySelector('#ampValue').textContent=Number(amplitude.value).toFixed(1)+'°';
speed.oninput=()=>document.querySelector('#speedValue').textContent=Number(speed.value).toFixed(1)+'×';
window.renderGuardAt=(t)=>{paused=true;elapsed=t;render(t)};
window.guardReady=Promise.all(Object.entries(src).map(([key,url])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve([key,im]);im.onerror=()=>reject(new Error('无法加载 '+key));im.src=url}))).then(entries=>{images=Object.fromEntries(entries);document.querySelector('#status').textContent='自动循环 · 肩膀与画框固定 · 可调摆幅和速度';requestAnimationFrame(loop);return true}).catch(e=>{document.querySelector('#error').textContent=e.message;throw e});
</script></html>
