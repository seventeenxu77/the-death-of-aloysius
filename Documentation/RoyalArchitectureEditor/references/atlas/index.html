<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<title>royal Scene 普通门清理后建筑剖面图册</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e5dc;color:#24384a;font:15px 'Microsoft YaHei',sans-serif}
header{position:sticky;top:0;z-index:2;background:#24384a;color:#fff;padding:14px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header strong{margin-right:auto}button,select,a{font:inherit}button,select{padding:7px 10px;border:1px solid #82909a;border-radius:5px;background:#fff;color:#24384a;cursor:pointer}
a{color:#f1d7a2;text-decoration:none}main{height:calc(100vh - 72px);overflow:auto;padding:20px;text-align:center}img{height:auto;display:block;margin:0 auto;box-shadow:0 2px 18px #0002;max-width:none}small{color:#d2dce2}
</style><header><strong>royal Scene · 普通门清理后</strong><button id="prev">上一页</button><select id="pages"></select><button id="next">下一页</button><select id="zoom"><option value="fit">适应窗口</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select><a href="http://127.0.0.1:8731/" target="_blank" rel="noopener">三维编辑工作台</a><a href="royal_scene_open_passages_atlas.pdf">完整 PDF</a></header>
<main id="canvas"><img id="sheet" alt="建筑剖面图"></main><script>
const sheets=[{"src": "sheets/01_01_whole.png", "title": "01  宫殿整体剖切总览"}, {"src": "sheets/02_02_hall.png", "title": "02  入口、长走廊与宴会大厅"}, {"src": "sheets/03_03_guards.png", "title": "03  三侍卫：完整错层套院"}, {"src": "sheets/04_04_upper_overview.png", "title": "04  二层人物套院与相邻门位"}, {"src": "sheets/05_05_arx.png", "title": "05  阿修斯套院：二层房间分解"}, {"src": "sheets/06_06_king.png", "title": "06  尤格斯王室：二层房间分解"}, {"src": "sheets/07_07_queen.png", "title": "07  阿萨拉内宫：二层房间分解"}, {"src": "sheets/08_08_lower_households.png", "title": "08  人物套院下层：生活与服务空间"}, {"src": "sheets/09_09_isis.png", "title": "09  伊西斯水庭与上下行路线"}, {"src": "sheets/10_10_basement_west.png", "title": "10  负一层西侧：后勤、旧宫与祭室"}, {"src": "sheets/11_11_basement_east.png", "title": "11  负一层东侧：蓄水、地牢与封印厅"}, {"src": "sheets/12_12_vertical_routes.png", "title": "12  东侧两部楼梯：楼层贯通关系"}, {"src": "sheets/13_13_guard_private_routes.png", "title": "13  三侍卫补图：私有跨院阶廊"}, {"src": "sheets/14_door_index_1.png", "title": "14  门与开放通道索引"}, {"src": "sheets/15_door_index_2.png", "title": "15  门与开放通道索引"}, {"src": "sheets/16_door_index_3.png", "title": "16  门与开放通道索引"}, {"src": "sheets/17_door_index_4.png", "title": "17  门与开放通道索引"}, {"src": "sheets/18_door_index_5.png", "title": "18  门与开放通道索引"}];let index=0;const image=document.getElementById('sheet'),pages=document.getElementById('pages'),zoom=document.getElementById('zoom');
sheets.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=s.title;pages.append(o)});
function size(){image.style.width=zoom.value==='fit'?'min(100%, 2200px)':(3400*Number(zoom.value))+'px'}
function show(i){index=(i+sheets.length)%sheets.length;image.src=sheets[index].src;image.alt=sheets[index].title;pages.value=index;document.getElementById('canvas').scrollTo(0,0);size()}
document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);pages.onchange=()=>show(Number(pages.value));zoom.onchange=size;window.onkeydown=e=>{if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)};show(0);
</script></html>
